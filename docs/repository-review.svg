<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">GitHub Portfolio Reviewer interface</title>
  <desc id="description">Dark developer-tool interface showing a portfolio presentation score, status counts, and prioritized improvements.</desc>
  <rect width="1200" height="675" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="673" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="48" y="38" width="34" height="34" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="65" y="60" fill="#58a6ff" font-family="monospace" font-size="12" text-anchor="middle">&lt;/&gt;</text>
    <text x="94" y="54" fill="#e6edf3" font-family="monospace" font-size="16" font-weight="700">repo-review</text>
    <text x="94" y="72" fill="#8b949e" font-size="13">GitHub portfolio signal inspector</text>
    <circle cx="988" cy="55" r="5" fill="#3fb950"/>
    <text x="1000" y="59" fill="#8b949e" font-family="monospace" font-size="12">PUBLIC API</text>
    <rect x="1084" y="38" width="76" height="34" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="1122" y="60" fill="#e6edf3" font-size="13" text-anchor="middle">Settings</text>
    <line x1="48" y1="96" x2="1160" y2="96" stroke="#21262d"/>

    <rect x="48" y="126" width="1112" height="86" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="68" y="151" fill="#e6edf3" font-size="15" font-weight="600">Review another repository</text>
    <rect x="68" y="165" width="466" height="32" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="82" y="186" fill="#e6edf3" font-family="monospace" font-size="14">longinhk/github-portfolio-reviewer</text>
    <rect x="550" y="165" width="150" height="32" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="564" y="186" fill="#e6edf3" font-size="13">General</text>
    <rect x="716" y="165" width="158" height="32" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="730" y="186" fill="#e6edf3" font-size="12">Linked folder</text>
    <rect x="890" y="165" width="250" height="32" rx="6" fill="#238636"/>
    <text x="1015" y="186" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Run review</text>

    <text x="48" y="252" fill="#58a6ff" font-family="monospace" font-size="20" font-weight="700">longinhk/github-portfolio-reviewer</text>
    <rect x="516" y="235" width="54" height="22" rx="11" fill="none" stroke="#58a6ff"/>
    <text x="543" y="250" fill="#58a6ff" font-family="monospace" font-size="11" text-anchor="middle">PUBLIC</text>
    <rect x="580" y="235" width="142" height="22" rx="11" fill="#10261a" stroke="#3fb950"/>
    <text x="651" y="250" fill="#3fb950" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">SOFTWARE · HIGH FIT</text>
    <text x="48" y="278" fill="#8b949e" font-size="14">Transparent repository signals for portfolio improvement.</text>

    <g transform="translate(48 306)">
      <rect width="1112" height="126" rx="7" fill="#161b22" stroke="#30363d"/>
      <line x1="270" y1="0" x2="270" y2="126" stroke="#30363d"/>
      <line x1="480" y1="0" x2="480" y2="126" stroke="#30363d"/>
      <line x1="690" y1="0" x2="690" y2="126" stroke="#30363d"/>
      <line x1="900" y1="0" x2="900" y2="126" stroke="#30363d"/>
      <text x="22" y="26" fill="#8b949e" font-family="monospace" font-size="12" font-weight="700">PORTFOLIO PRESENTATION SCORE</text>
      <text x="22" y="70" fill="#e6edf3" font-family="monospace" font-size="38" font-weight="700">80.5</text>
      <text x="115" y="70" fill="#8b949e" font-family="monospace" font-size="14">/100</text>
      <rect x="22" y="98" width="220" height="4" rx="2" fill="#21262d"/>
      <rect x="22" y="98" width="177" height="4" rx="2" fill="#3fb950"/>

      <text x="294" y="31" fill="#8b949e" font-family="monospace" font-size="12" font-weight="700">PASS</text>
      <text x="294" y="67" fill="#3fb950" font-family="monospace" font-size="26" font-weight="700">17</text>
      <text x="294" y="91" fill="#8b949e" font-size="13">checks satisfied</text>

      <text x="504" y="31" fill="#8b949e" font-family="monospace" font-size="12" font-weight="700">PARTIAL</text>
      <text x="504" y="67" fill="#d29922" font-family="monospace" font-size="26" font-weight="700">3</text>
      <text x="504" y="91" fill="#8b949e" font-size="13">some evidence</text>

      <text x="714" y="31" fill="#8b949e" font-family="monospace" font-size="12" font-weight="700">NEEDS WORK</text>
      <text x="714" y="67" fill="#f85149" font-family="monospace" font-size="26" font-weight="700">7</text>
      <text x="714" y="91" fill="#8b949e" font-size="13">needs attention</text>

      <text x="924" y="31" fill="#8b949e" font-family="monospace" font-size="12" font-weight="700">AVAILABLE</text>
      <text x="924" y="67" fill="#58a6ff" font-family="monospace" font-size="26" font-weight="700">+19.5</text>
      <text x="924" y="91" fill="#8b949e" font-size="13">recoverable points</text>
    </g>

    <text x="48" y="477" fill="#8b949e" font-family="monospace" font-size="12" font-weight="700">HIGHEST-IMPACT NEXT STEPS</text>
    <g transform="translate(48 496)">
      <rect width="1112" height="46" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="18" y="29" fill="#8b949e" font-family="monospace" font-size="12">#01</text>
      <rect x="58" y="14" width="42" height="18" rx="9" fill="#3b1c20" stroke="#f85149"/>
      <text x="79" y="27" fill="#f85149" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">HIGH</text>
      <text x="118" y="29" fill="#e6edf3" font-size="14" font-weight="600">Explicit license</text>
      <text x="1082" y="29" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="end">+3 pts</text>
    </g>
    <g transform="translate(48 552)">
      <rect width="1112" height="46" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="18" y="29" fill="#8b949e" font-family="monospace" font-size="12">#02</text>
      <rect x="58" y="14" width="58" height="18" rx="9" fill="#382b12" stroke="#d29922"/>
      <text x="87" y="27" fill="#d29922" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">MEDIUM</text>
      <text x="134" y="29" fill="#e6edf3" font-size="14" font-weight="600">Usage examples</text>
      <text x="1082" y="29" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="end">+2 pts</text>
    </g>
    <g transform="translate(48 608)">
      <rect width="1112" height="46" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="18" y="29" fill="#8b949e" font-family="monospace" font-size="12">#03</text>
      <rect x="58" y="14" width="58" height="18" rx="9" fill="#382b12" stroke="#d29922"/>
      <text x="87" y="27" fill="#d29922" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">MEDIUM</text>
      <text x="134" y="29" fill="#e6edf3" font-size="14" font-weight="600">Reproducible dependencies</text>
      <text x="1082" y="29" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="end">+1.5 pts</text>
    </g>
  </g>
</svg>
