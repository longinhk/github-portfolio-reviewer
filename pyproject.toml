[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "github-portfolio-reviewer"
version = "0.2.0"
description = "Review how public GitHub repositories present portfolio projects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "streamlit>=1.36,<2",
]

[project.urls]
Repository = "https://github.com/longinhk/github-portfolio-reviewer"
Issues = "https://github.com/longinhk/github-portfolio-reviewer/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.20,<2",
    "pytest>=8.2,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.5,<1",
]

[project.scripts]
portfolio-review = "github_portfolio_reviewer.cli:main"
portfolio-evaluate = "github_portfolio_reviewer.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
